name: AS Academy WhatsApp Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Restart every 5 hours (less churn = stable session)


concurrency:
  group: whatsapp-bot      # Only ONE bot instance allowed at a time
  cancel-in-progress: true # Kill the old run before starting the new one

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290   # ~4h 50min — exits cleanly before GitHub's 6h hard kill

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Start AI Bot
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        # Run bot for ~17,400s (4h 50min), then send SIGTERM for graceful shutdown.
        # The bot's SIGTERM handler uploads session & closes WA connection cleanly.
        run: |
          node index.js &
          BOT_PID=$!
          sleep 17400
          echo "⏰ Scheduled shutdown: sending SIGTERM to bot (PID $BOT_PID)"
          kill -SIGTERM $BOT_PID
          wait $BOT_PID || true
          echo "✅ Bot exited cleanly."
